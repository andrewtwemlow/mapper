[package]
name = "gpx-mapper"
version = "0.1.0"
edition = "2021"
description = "WebAssembly crate for parsing GPS activity files and generating GPX/HTML map output"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WebAssembly / JS interop
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Error handling
thiserror = "2"

# GPX/XML parsing and writing
quick-xml = { version = "0.42", features = ["serialize"] }

# FIT file parsing
fitparser = "0.12"

# gzip decompression
flate2 = "1"

# Serialisation (for the embedded JSON track data in HTML output)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimise for size when targeting wasm
opt-level = "s"
lto = true
