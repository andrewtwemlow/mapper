server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for liveness/readiness probes
    # Returns 200 OK with a minimal JSON body — no upstream required.
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Serve WebAssembly files with the correct MIME type
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
    }

    # SPA fallback: any unmatched path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|wasm|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html so the app shell is always fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
